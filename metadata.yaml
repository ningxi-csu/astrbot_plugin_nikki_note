name: astrbot_plugin_nikki_note
display_name: 无限暖暖日程便利贴
short_desc: 每人绑定自己的账号，查询奇想手账日程、账号总览与卡池共鸣统计
desc: |
  无限暖暖 · 奇想手账查询插件。

  - 每位用户私聊机器人，用手机号 + 短信验证码或账号 + 密码绑定自己的叠纸账号
  - 私聊发送 /暖暖绑定b站，扫码登录 B 站并自动关联叠纸账号
  - 在群聊或私聊发送 /暖暖日程 查看自己的日程
  - 发送 /暖暖总览 查看账号数据、探索总览、奇想札记与奇迹之冠
  - 发送 /查询卡池 按套装简称、版本、版本双四或常驻池查询共鸣次数、集齐状态和最高进化
  - 登录态自动续期，结果缓存 60 秒，并带查询冷却
  - 登录态与 B 站绑定信息按 QQ 号隔离保存在 AstrBot 的 data/plugin_data 目录

  指令：
  /暖暖日程、/暖暖总览、/查询卡池 蝴蝶套、/查询卡池 1.0、/查询卡池 1.0双四、/查询卡池 常驻、/暖暖绑定 手机号、/暖暖验证码 验证码、/暖暖密码登录 账号 密码、/暖暖绑定b站、/暖暖解绑、/暖暖帮助
version: 1.0.0
author: ningxi-csu
repo:https://github.com/ningxi-csu/astrbot_plugin_nikki_note
